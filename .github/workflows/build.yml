name: Verificar config NixOS (Apple Silicon)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # botón "Run workflow" para validar el build completo

env:
  NIX_CONFIG: |
    extra-substituters = https://cache.nixos.org https://cosmic.cachix.org https://nix-community.cachix.org
    extra-trusted-public-keys = cosmic.cachix.org-1:Dya9IyXD4xd0hV8x1JsDd3CgE6GP5gDdhI5rAeBMKfs= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
    experimental-features = nix-command flakes
    cores = 0

jobs:
  # ============================================================
  # FASE 1: EVALUACIÓN (rápida, en cada push)
  # Detecta sintaxis, opciones inexistentes, paquetes rotos, etc.
  # ============================================================
  eval:
    name: Evaluar configuración
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Nix (Determinate)
        uses: DeterminateSystems/nix-installer-action@v13

      - name: Stub hardware-configuration.nix (solo CI)
        run: |
          cat > hardware-configuration.nix <<'EOF'
          { config, lib, pkgs, ... }:
          {
            fileSystems."/" = { device = "/dev/null"; fsType = "ext4"; };
            boot.loader.systemd-boot.enable = lib.mkForce false;
          }
          EOF
          # Los flakes solo ven archivos trackeados por git
          git add -A hardware-configuration.nix

      - name: Evaluar la configuración completa
        run: |
          echo "=== Salidas del flake ==="
          nix flake show --all-systems --no-write-lock-file 2>&1 | tail -25 || true
          echo "=== Evaluación ==="
          nix eval --show-trace .#nixosConfigurations.macnix.config.system.build.toplevel.drvPath --raw 2>&1 | tail -40
          echo "✅ La configuración evalúa correctamente"

  # ============================================================
  # FASE 2: BUILD COMPLETO (lento — solo manual)
  # Compila el sistema entero para aarch64-linux nativamente.
  # ============================================================
  build:
    name: Compilar sistema completo (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Nix (Determinate)
        uses: DeterminateSystems/nix-installer-action@v13

      - name: Stub hardware-configuration.nix (solo CI)
        run: |
          cat > hardware-configuration.nix <<'EOF'
          { config, lib, pkgs, ... }:
          {
            fileSystems."/" = { device = "/dev/null"; fsType = "ext4"; };
            boot.loader.systemd-boot.enable = lib.mkForce false;
          }
          EOF
          git add -A hardware-configuration.nix

      - name: Compilar el sistema (toplevel)
        run: |
          nix build .#nixosConfigurations.macnix.config.system.build.toplevel --print-build-logs 2>&1 | tail -100

      - name: Resultado
        run: |
          echo "✅ Sistema compilado correctamente para aarch64-linux"
          readlink -f result
