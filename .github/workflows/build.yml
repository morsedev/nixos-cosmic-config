name: Verificar config NixOS (Apple Silicon)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # botón "Run workflow" para validar el build completo

env:
  NIX_CONFIG: |
    extra-substituters = https://cache.nixos.org https://cosmic.cachix.org https://nix-community.cachix.org
    extra-trusted-public-keys = cosmic.cachix.org-1:Dya9IyXD4xd0hV8x1JsDd3CgE6GP5gDdhI5rAeBMKfs= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
    experimental-features = nix-command flakes
    cores = 0

jobs:
  # ============================================================
  # FASE 1: EVALUACIÓN (rápida, en cada push)
  # ============================================================
  eval:
    name: Evaluar configuración
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # evitar problemas de flake con clones shallow

      - name: Instalar Nix (Determinate)
        uses: DeterminateSystems/nix-installer-action@v13

      - name: Diagnóstico de salidas
        run: |
          git config --global --add safe.directory "$PWD"
          echo "=== attrNames de nixosConfigurations ==="
          nix eval --json .#nixosConfigurations --apply 'builtins.attrNames' || true
          echo "=== attrNames de macnix ==="
          nix eval --json .#nixosConfigurations.macnix --apply 'builtins.attrNames' || true

      - name: Evaluar la configuración completa
        run: |
          set -o pipefail
          echo "=== hostName ==="
          nix eval .#nixosConfigurations.macnix.config.networking.hostName --raw
          echo ""
          echo "=== drvPath del toplevel ==="
          if nix eval --show-trace .#nixosConfigurations.macnix.config.system.build.toplevel.drvPath --raw > /tmp/eval.out 2>/tmp/eval.err; then
            echo "✅ Eval OK: $(cat /tmp/eval.out)"
          else
            echo "❌ EVAL FALLÓ"
            grep -n "error:" /tmp/eval.err | tail -5
            echo "--- tail del trace ---"
            tail -70 /tmp/eval.err
            exit 1
          fi

  # ============================================================
  # FASE 2: BUILD COMPLETO (lento — solo manual)
  # ============================================================
  build:
    name: Compilar sistema completo (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Nix (Determinate)
        uses: DeterminateSystems/nix-installer-action@v13

      - name: Compilar el sistema (toplevel)
        run: |
          git config --global --add safe.directory "$PWD"
          nix build --print-build-logs .#nixosConfigurations.macnix.config.system.build.toplevel 2>&1 | tail -100

      - name: Resultado
        run: |
          echo "✅ Sistema compilado correctamente para aarch64-linux"
          readlink -f result
